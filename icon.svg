<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="128" cy="70" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a4a1c"/>
      <stop offset="0.45" stop-color="#2e1d10"/>
      <stop offset="1" stop-color="#120d09"/>
    </radialGradient>
    <radialGradient id="flame" cx="128" cy="58" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4c2" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f6b13d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6b13d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0706"/>
      <stop offset="1" stop-color="#020101"/>
    </linearGradient>
    <linearGradient id="salt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f1e4d6"/>
      <stop offset="1" stop-color="#c9a991"/>
    </linearGradient>
    <radialGradient id="reflector" cx="128" cy="40" r="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.6" stop-color="#e2c17e"/>
      <stop offset="1" stop-color="#b8893f"/>
    </radialGradient>
    <radialGradient id="eye"cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4ffd0"/>
      <stop offset="0.5" stop-color="#b8e05a"/>
      <stop offset="1" stop-color="#b8e05a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background: rock lit warm from the lamp -->
  <rect width="256" height="256" rx="44" fill="url(#glow)"/>

  <!-- tunnel mouth -->
  <path d="M58 236 L58 112 Q128 74 198 112 L198 236 Z" fill="url(#tunnel)"/>

  <!-- eyes in the dark -->
  <ellipse cx="108" cy="160" rx="16" ry="11" fill="url(#eye)"/>
  <ellipse cx="146" cy="160" rx="16" ry="11" fill="url(#eye)"/>
  <ellipse cx="108" cy="160" rx="5" ry="4" fill="#fbffe8"/>
  <ellipse cx="146" cy="160" rx="5" ry="4" fill="#fbffe8"/>

  <!-- timber frame: posts and cap -->
  <rect x="40" y="88" width="28" height="160" rx="3" fill="#6e4825"/>
  <rect x="188" y="88" width="28" height="160" rx="3" fill="#5c3b1e"/>
  <rect x="44" y="88" width="7" height="160" fill="#8a5d33"/>
  <rect x="192" y="88" width="6" height="160" fill="#74502b"/>
  <rect x="26" y="70" width="204" height="30" rx="4" fill="#7b5129"/>
  <rect x="26" y="70" width="204" height="8" rx="4" fill="#a2713f"/>
  <rect x="26" y="94" width="204" height="6" fill="#4a2f17"/>

  <!-- carbide lamp hanging from the cap -->
  <circle cx="128" cy="44" r="44" fill="url(#flame)"/>
  <rect x="116" y="62" width="24" height="26" rx="5" fill="#b07a32"/>
  <rect x="116" y="62" width="8" height="26" rx="3" fill="#d39c4b"/>
  <circle cx="128" cy="42" r="21" fill="#9a6a2c"/>
  <circle cx="128" cy="42" r="17" fill="url(#reflector)"/>
  <path d="M128 26 Q137 38 132 47 Q128 51 124 47 Q119 38 128 26 Z" fill="#fff1b8"/>
  <path d="M128 33 Q132 40 130 45 Q128 47 126 45 Q124 40 128 33 Z" fill="#ffffff"/>

  <!-- salt crystal in the lamp light -->
  <path d="M150 238 L166 176 L190 160 L212 186 L204 238 Z" fill="url(#salt)"/>
  <path d="M166 176 L190 160 L186 238 L150 238 Z" fill="#ffffff" fill-opacity="0.55"/>
  <path d="M190 160 L212 186 L204 238 L186 238 Z" fill="#b58d74" fill-opacity="0.55"/>
  <path d="M126 238 L138 204 L156 198 L162 238 Z" fill="url(#salt)"/>
  <path d="M138 204 L156 198 L150 238 L126 238 Z" fill="#ffffff" fill-opacity="0.5"/>
</svg>
