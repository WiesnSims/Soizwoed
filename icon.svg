<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="rock" cx="128" cy="150" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e4420"/>
      <stop offset="0.4" stop-color="#2c1b0e"/>
      <stop offset="1" stop-color="#110c08"/>
    </radialGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0807"/>
      <stop offset="1" stop-color="#030202"/>
    </linearGradient>
    <radialGradient id="halo" cx="128" cy="152" r="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="0.3" stop-color="#f0a040" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0a040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98a2c"/>
      <stop offset="0.5" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#c97a22"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4316"/>
      <stop offset="0.35" stop-color="#e0b25c"/>
      <stop offset="0.6" stop-color="#b9842f"/>
      <stop offset="1" stop-color="#5a3812"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4ffd0"/>
      <stop offset="0.5" stop-color="#b8e05a"/>
      <stop offset="1" stop-color="#b8e05a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background: rock lit warm from the lamp -->
  <rect width="256" height="256" rx="44" fill="url(#rock)"/>

  <!-- tunnel mouth -->
  <rect x="62" y="96" width="132" height="160" fill="url(#tunnel)"/>

  <!-- eyes deep in the dark -->
  <ellipse cx="88" cy="228" rx="13" ry="9" fill="url(#eye)"/>
  <ellipse cx="114" cy="228" rx="13" ry="9" fill="url(#eye)"/>
  <ellipse cx="88" cy="228" rx="4" ry="3" fill="#fbffe8"/>
  <ellipse cx="114" cy="228" rx="4" ry="3" fill="#fbffe8"/>

  <!-- timber frame: posts and cap -->
  <rect x="40" y="96" width="26" height="160" rx="3" fill="#6e4825"/>
  <rect x="190" y="96" width="26" height="160" rx="3" fill="#5c3b1e"/>
  <rect x="44" y="96" width="7" height="160" fill="#8a5d33"/>
  <rect x="194" y="96" width="6" height="160" fill="#74502b"/>
  <rect x="24" y="72" width="208" height="30" rx="4" fill="#7b5129"/>
  <rect x="24" y="72" width="208" height="8" rx="4" fill="#a2713f"/>
  <rect x="24" y="96" width="208" height="6" fill="#4a2f17"/>

  <!-- the lamp's light -->
  <circle cx="128" cy="152" r="74" fill="url(#halo)"/>

  <!-- old miner's lamp hanging from the cap beam -->
  <path d="M128 100 L128 110" stroke="#3a2a18" stroke-width="4"/>
  <circle cx="128" cy="113" r="6" fill="none" stroke="#c99a48" stroke-width="3.5"/>
  <path d="M110 132 L114 120 L142 120 L146 132 Z" fill="url(#brass)"/>
  <rect x="106" y="130" width="44" height="7" rx="2" fill="#8e6024"/>
  <rect x="110" y="137" width="36" height="40" fill="url(#glass)"/>
  <path d="M128 144 Q135 154 131 163 Q128 167 125 163 Q121 154 128 144 Z" fill="#fffbe8"/>
  <rect x="109" y="137" width="4" height="40" fill="#4a3216"/>
  <rect x="121" y="137" width="3" height="40" fill="#4a3216" fill-opacity="0.8"/>
  <rect x="132" y="137" width="3" height="40" fill="#4a3216" fill-opacity="0.8"/>
  <rect x="143" y="137" width="4" height="40" fill="#4a3216"/>
  <rect x="104" y="176" width="48" height="8" rx="2" fill="#8e6024"/>
  <rect x="106" y="183" width="44" height="22" rx="4" fill="url(#brass)"/>
  <rect x="106" y="191" width="44" height="3" fill="#5a3812"/>
</svg>
